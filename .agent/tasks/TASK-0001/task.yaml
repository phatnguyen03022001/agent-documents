acceptance_criteria:
  - id: AC-1
    requirement: "The exact 45 concern keys remain unchanged and each concern now declares exactly one canonical authority domain rather than a fixed physical home path."
    evidence_required: "Exact key-set comparison plus concern authority-domain inspection."
  - id: AC-2
    requirement: "APPLICABLE concerns cannot self-attest resolved depth without structural documentation support: NONE has zero support refs; L0/L1/L2 has at least one support ref in the concern's authority domain."
    evidence_required: "Focused negative and positive validator tests."
  - id: AC-3
    requirement: "Heading-only, whitespace-only, or HTML-comment-only support sections do not establish support; a minimal real content line does."
    evidence_required: "Focused validator tests for each empty-section case and one valid case."
  - id: AC-4
    requirement: "The model defines eight authority domains, not an eight-physical-file ceiling; root files remain valid and one-level authority shards are accepted."
    evidence_required: "DOCUMENT_MODEL/schema/validator consistency plus root and shard tests."
  - id: AC-5
    requirement: "Wrong-domain refs and shard nesting deeper than one level fail deterministically."
    evidence_required: "Focused negative tests."
  - id: AC-6
    requirement: "milestone.root_refs provides explicit roots for legitimate cross-cutting entities and validates exact referenced IDs/classes."
    evidence_required: "Schema/model/validator consistency and focused tests."
  - id: AC-7
    requirement: "Orphan analysis is true reachability from all FTR roots plus milestone.root_refs; disconnected referenced clusters cannot game the orphan check."
    evidence_required: "Tests proving orphan without root, valid with root, and disconnected cluster remains orphaned."
  - id: AC-8
    requirement: "Unknown root refs, FTR/UNK root refs, duplicate roots, and DEFER capability roots fail deterministically."
    evidence_required: "Focused negative tests."
  - id: AC-9
    requirement: "The validator remains Python-standard-library-only, deterministic, read-only, and does not judge prose quality or factual correctness."
    evidence_required: "Source inspection, py_compile, and tests."
  - id: AC-10
    requirement: "A genuinely closed minimal target using support_refs and root semantics produces DOCS_READY = TRUE; existing mandatory negative behavior remains covered."
    evidence_required: "Full unittest result."
  - id: AC-11
    requirement: "No candidate/model file is added or removed; only authorized existing files plus report.yaml change. main remains unchanged."
    evidence_required: "Exact changed-file inventory and Git ref evidence."
  - id: AC-12
    requirement: "The result remains explicitly an unreleased candidate pending Architect and independent audit."
    evidence_required: "README/DOCUMENT_MODEL/report evidence and no release/tag/promotion."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "python -m unittest discover -s tests"
      required: true
    - id: CHECK-2
      command_or_check: "python -m py_compile tools/validate.py tests/test_validate.py"
      required: true
    - id: CHECK-3
      command_or_check: "Parse every repository JSON file with Python stdlib json and fail on parse error."
      required: true
    - id: CHECK-4
      command_or_check: "Assert the 45 concern key set is byte-for-byte equivalent as a set to candidate f79d220ff700f5fa59cdb59365fe2a2e13634c76."
      required: true
    - id: CHECK-5
      command_or_check: "Run focused support-ref tests: missing support, wrong authority, empty/comment-only section, valid non-empty section."
      required: true
    - id: CHECK-6
      command_or_check: "Run focused shard tests: valid root, valid one-level shard, wrong domain, excessive nesting."
      required: true
    - id: CHECK-7
      command_or_check: "Run focused root/reachability tests: orphan without root, valid explicit root, unknown root ref, forbidden root class, DEFER root, disconnected cluster."
      required: true
    - id: CHECK-8
      command_or_check: "Verify no unapproved new file, no dependency/package manifest, no YAML catalog, no generated committed DOCS_READY artifact, no main mutation, no force update, no tag/release/promotion."
      required: true
  authoritative_verification:
    required: false
    mechanism: "Architect exact-SHA review followed by independent blind audits before any release/promotion decision."
    expected_signal: "Executor evidence only; Executor cannot author authoritative PASS."

