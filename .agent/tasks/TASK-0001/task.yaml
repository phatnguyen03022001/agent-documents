  - "Any new target-document authority domain beyond the approved eight."
  - "Any change to the 45 concern keys."
  - "Any database, service, web UI, API/MCP server, generator framework, package dependency, YAML layer, or orchestration mechanism."
  - "Any semantic maturity/quality-level definition belonging to agent-standards."
  - "Any agent-role or authority-protocol redesign belonging to agent-skills."
  - "Any project-specific or IELTS-specific documentation content."
  - "Any change to .agent/tasks/TASK-0001/task.yaml by the Executor."
  - "Creation of review.yaml by the Executor."
  - "Force push, history rewrite, direct mutation of main, merge/promotion to main, tag, or release."

