structure_authority:
  status: RESOLVED
  source: "Existing V1 candidate plus reconciled adversarial findings."
  rationale: "Preserve the existing architecture; correct only deterministic false-green closure paths."

objective: >-
  Harden the unreleased V1 candidate against machine-detectable false-green DOCS_READY outcomes without redesigning the eight-domain, 45-concern, one-level-sharding, rooted-reachability, depth, or stop-rule model. Produce updated Executor evidence for Architect review and renewed independent audit.

scope:
  required_changes:
    - "Use causal TDD: new regression tests must fail on revision-2 behavior before production validator changes."
    - "Logical Markdown references must ignore ATX-looking headings inside fenced code blocks and HTML comments. Do not add an external Markdown parser."
    - "Each logical <file, token> reference must resolve to exactly one canonical ATX heading; duplicate matches fail deterministically."
    - "milestone.scope_ref and all existing canonical entity/specification/explanation refs (doc_ref, spec_ref, boundary_ref, defer_ref, exit.ref) must resolve to sections containing at least one non-heading, non-whitespace, non-HTML-comment content line. Existing support_refs retain the same rule."
    - "OPEN + DECISION_REQUIRED + resolution_phase DESIGN requires blocking=true."
    - "product.objective is always APPLICABLE in V1 and cannot be N/A. Do not require any arbitrary minimum FTR/entity count."
    - "Keep DOCUMENT_MODEL.md, schema, validator, and tests consistent with these invariants."
    - "Update the existing .agent/tasks/TASK-0001/report.yaml as revision-3 Executor evidence; create no second report artifact."
  allowed_existing_files_or_components:
    - DOCUMENT_MODEL.md
    - model/project.schema.v1.json
    - tools/validate.py
    - tests/test_validate.py
    - .agent/tasks/TASK-0001/report.yaml
    - .agent/tasks/TASK-0001/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "model/coverage.v1.json and the exact 45 concern taxonomy remain unchanged."
  - "Exactly eight authority domains remain unchanged."
  - "One-level sharding, graph-root semantics, L0/L1/L2 semantics, build/buy semantics, and STOP rule remain unchanged except product.objective cannot be N/A."
  - "Do not add reason-code vocabularies, root-count heuristics, semantic scoring, NLP/LLM validation, new concerns, new domains, or arbitrary minimum feature/entity counts."
  - "Structural checks prove presence only, never correctness or runtime evidence."
  - "Validator remains deterministic, read-only, network-free, and Python-standard-library-only."
  - "No new candidate/model/template/workflow/dependency file or directory."
  - "Executor must not modify task.yaml."
  - "main is read-only; no promotion, tag, release, or repository metadata mutation."

forbidden_changes:
  - "Any redesign or unrelated cleanup."
  - "Any change to model/coverage.v1.json."
  - "Any new file except no new files are authorized; report.yaml already exists and may only be updated as Executor evidence."
  - "Any external dependency or workflow."
  - "Any main mutation, promotion, tag, release, or metadata mutation."

