structure_authority:
  status: RESOLVED
  source: "TASK-0001 revision 2"
  rationale: "Preserve the existing 15-file V1 candidate architecture and correct exactly three material model gaps: truth-linked coverage support, scalable physical document sharding under eight fixed authority domains, and rooted reachability for cross-cutting entities."

objective: >-
  Revise the unreleased agent-documents V1 candidate without redesigning its foundation.
  Preserve the exact 45 concern universe, eight authority domains, single project catalog,
  L0/L1/L2 depth model, explicit unknown/build-buy semantics, closed-world milestone model,
  and standard-library-only deterministic validator. Close H1 truth-linked coverage, H2
  large-project physical document scaling, and H3 cross-cutting graph-root semantics.
  Produce the protocol-required Executor report. The result remains an unreleased candidate
  pending Architect and independent audit.

scope:
  required_changes:
    - "H1: Rename coverage evidence_refs to support_refs everywhere in the V1 model, schema, template catalog, validator, normative docs, and tests."
    - "H1: For APPLICABLE concerns, actual_depth NONE requires support_refs to be empty; actual_depth L0/L1/L2 requires at least one support_ref."
    - "H1: Every support_ref must resolve to a logical Markdown section in the concern's canonical authority domain."
    - "H1: A resolved support section must contain at least one non-heading, non-whitespace, non-HTML-comment content line within that section; heading-only or comment-only sections do not establish support."
    - "H1: Preserve validator non-semantic boundary: it validates presence/location/structural support, not prose quality or factual correctness."
    - "H2: Replace the V1 concept of exactly eight physical Markdown files with exactly eight canonical authority domains: PRODUCT, BEHAVIOR, ARCHITECTURE, DATA, INTERFACES, QUALITY, DELIVERY, DECISIONS."
    - "H2: Keep the eight root Markdown templates as the default small-project shape, but allow target repositories to shard an authority domain one physical level deeper using docs/<lowercase-domain>/<file>.md."
    - "H2: Supported canonical paths are either docs/<DOMAIN>.md or docs/<lowercase-domain>/<safe-file>.md. Nested shard directories deeper than one level are invalid."
    - "H2: Sharding changes physical organization only; it does not create a ninth authority domain or a second authority for any concept. A shard becomes canonical only when referenced by the catalog/coverage model."
    - "H2: Change model/coverage.v1.json concern metadata from a physical home path to an authority-domain identity so support refs may legally point to root or shard files within that authority."
    - "H2: Entity-specific logical references must continue to resolve within their required authority domain, but may use a legal shard path."
    - "H3: Add milestone.root_refs as an explicit array of non-feature material entity IDs that belong directly to the current milestone without needing a feature relationship."
    - "H3: Orphan detection must use reachability from roots, not merely whether any other record references an entity. Roots are every current FTR record plus milestone.root_refs."
    - "H3: Traverse deterministic catalog edges from reachable records. A disconnected cluster must remain orphaned even if its members reference each other."
    - "H3: milestone.root_refs must resolve, must not contain FTR or UNK IDs, must not contain a DEFER capability, and duplicate root refs are invalid."
    - "Preserve exactly the same 45 coverage concern keys. Do not add, remove, rename, or merge a concern in this task."
    - "Create .agent/tasks/TASK-0001/report.yaml as the Executor-owned protocol report for revision 2."
  allowed_existing_files_or_components:
    - README.md
    - DOCUMENT_MODEL.md
    - model/coverage.v1.json
    - model/project.schema.v1.json
    - templates/docs/PRODUCT.md
    - templates/docs/BEHAVIOR.md
    - templates/docs/ARCHITECTURE.md
    - templates/docs/DATA.md
    - templates/docs/INTERFACES.md
    - templates/docs/QUALITY.md
    - templates/docs/DELIVERY.md
    - templates/docs/DECISIONS.md
    - templates/docs/catalog/project.json
    - tools/validate.py
    - tests/test_validate.py
    - .agent/tasks/TASK-0001/task.yaml
  expected_files_are_restrictive: true

reference_model:
  authority_domains:
    PRODUCT:
      root: docs/PRODUCT.md
      shard_directory: docs/product/
    BEHAVIOR:
      root: docs/BEHAVIOR.md
      shard_directory: docs/behavior/
    ARCHITECTURE:
      root: docs/ARCHITECTURE.md
      shard_directory: docs/architecture/
    DATA:
      root: docs/DATA.md
      shard_directory: docs/data/
    INTERFACES:
      root: docs/INTERFACES.md
      shard_directory: docs/interfaces/
    QUALITY:
      root: docs/QUALITY.md
      shard_directory: docs/quality/
    DELIVERY:
      root: docs/DELIVERY.md
      shard_directory: docs/delivery/
    DECISIONS:
      root: docs/DECISIONS.md
      shard_directory: docs/decisions/
  shard_constraints:
    maximum_directory_depth_below_docs: 1
    filename_rule: "one non-empty safe Markdown filename; no subdirectory below the authority shard directory"
  support_semantics:
    actual_depth_none: "support_refs must be []"
    actual_depth_resolved: "L0/L1/L2 requires >=1 support_ref"
    authority_match_required: true
    non_empty_section_required: true
    semantic_quality_judgment: false
  graph_roots:
    implicit:
      - "all current FTR records"
    explicit_field: milestone.root_refs
    explicit_allowed_classes:
      - ACT
      - ROL
      - ACC
      - SYS
      - DAT
      - IFC
      - FLW
      - EXT
      - CAP
      - DEC
    forbidden_classes:
      - FTR
      - UNK

invariants:
  - no unrelated cleanup or adjacent fixes
  - no concern-taxonomy change
  - no ninth authority domain
  - no one-file-per-concern or one-file-per-feature requirement
  - no requirement that a target project physically shard documents
  - no extra catalog file
  - no YAML catalog layer
  - no external runtime or validation dependency
  - no natural-language quality scoring
  - no generated committed coverage matrix
  - no GitHub Actions in this candidate
  - no force push
  - no history rewrite
  - no main mutation
  - no promotion during TASK-0001 revision 2
  - no tag or release creation
  - Executor must not modify this task.yaml

