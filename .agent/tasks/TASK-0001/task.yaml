  source: "TASK-0001 revision 3 architecture and exact Architect reproduction."
  rationale: "Preserve the revision-3 model and fix only the parser precedence regression introduced while hardening fenced-code and HTML-comment heading resolution."

objective: >-
  Correct one deterministic revision-3 Markdown scanning regression without redesign. A literal HTML-comment opener inside a fenced code block must remain fenced content and must not erase later canonical headings after the fence closes. Preserve all revision-3 false-green protections, exact 45 concerns, eight authority domains, one-level sharding, rooted reachability, depth semantics, and validator boundary. Update Executor evidence and return NEEDS_REVIEW.

scope:
  required_changes:
    - "Use causal TDD: reproduce on exact revision-3 behavior that a fenced literal '<!--' can suppress a real canonical heading after the fence."
    - "Make fenced-code context take precedence over HTML-comment interpretation: inside an active backtick or tilde fence, '<!--' and '-->' are ordinary fenced content."
    - "A real canonical heading after a properly closed fence must resolve even when fenced content contains an unclosed literal '<!--'."
    - "Preserve revision-3 behavior: headings inside fences remain ignored; headings inside actual HTML comments outside fences remain ignored; duplicate canonical heading tokens fail; canonical refs require structural content; design DECISION_REQUIRED blocking and product.objective applicability remain unchanged."
    - "Do not implement a full CommonMark parser or broaden into inline-code/comment parsing beyond what is required to resolve this concrete fence/comment precedence defect."
    - "Update the existing .agent/tasks/TASK-0001/report.yaml as revision-4 Executor evidence; create no second report artifact."
  allowed_existing_files_or_components:
    - tools/validate.py
    - tests/test_validate.py
    - .agent/tasks/TASK-0001/report.yaml
    - .agent/tasks/TASK-0001/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "DOCUMENT_MODEL.md, model/coverage.v1.json, model/project.schema.v1.json, templates, and README remain unchanged."
  - "Exactly 45 concerns and eight authority domains remain unchanged."
  - "All revision-3 normative semantics remain unchanged; this task fixes implementation behavior only."
  - "Validator remains deterministic, read-only, network-free, and Python-standard-library-only."
  - "No external Markdown parser or dependency."
  - "No new file or directory."
  - "Executor must not modify task.yaml."
  - "main is read-only; no promotion, tag, release, or repository metadata mutation."

