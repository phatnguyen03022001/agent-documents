structure_authority:
  status: RESOLVED
  source: "Existing DOCUMENT_MODEL.md, V1 schema, deterministic validator/tests, and DECISIONS template."
  rationale: "All defects fit current owners. No new authority domain, identity class, concern, registry, service, generator, database, workflow engine, or new top-level structure is justified."

objective: >-
  Correct only three audit-proven defects in the unreleased V1 candidate: make closure-relevant resolved unknowns carry attributable resolution evidence, make role/feature actor association internally consistent, and remove documentation-model ownership bleed that commands design workflow after DOCS_READY. Preserve the eight domains, 45 concerns, twelve identity classes, structural-only prose-validation boundary, shallow sharding, rooted reachability, and all unrelated V1 semantics.

scope:
  required_changes:
    - "Use causal TDD on the exact authorized base before production mutation. Reproduce: (1) a resolved contradiction/authority conflict can close through an arbitrary non-resolution identity without dedicated resolution evidence; (2) a ROL record can have zero actor_refs and/or a feature can reference a role whose actor set has no intersection with the feature actor_refs; and (3) DOCUMENT_MODEL.md §14 normatively commands design expansion to stop rather than limiting itself to documentation closure/reopening semantics."
    - "Resolved-unknown attribution: introduce the smallest deterministic V1-candidate representation that makes the resolution itself structurally attributable without forcing every QUESTION or ASSUMPTION into a DEC record. A RESOLVED UNK must retain resolved_by_ref and also carry an explicit resolution_ref in the DECISIONS authority domain. resolution_ref must resolve to structural content under a heading token bound to that exact UNK identity. DECISION_REQUIRED retains its existing requirement that resolved_by_ref is DEC-*. Do not globally require every entity doc_ref/spec_ref token to equal its catalog ID."
    - "Update DOCUMENT_MODEL.md, model/project.schema.v1.json, tools/validate.py, tests/test_validate.py, and templates/docs/DECISIONS.md only as necessary for the resolved-unknown correction. The DECISIONS template may describe resolved UNK sections alongside DEC sections; do not create a ninth document or new catalog."
    - "Actor/role association: require every ROL actor_refs array to contain at least one ACT reference. When a feature relation names ROL refs, each referenced role must share at least one ACT with that feature's actor_refs. Preserve globally reusable roles; do not require a role's full actor set to equal or be a subset of one feature's actors."
    - "Stop-rule ownership: rewrite DOCUMENT_MODEL.md §14 so agent-documents defines documentation closure stability/invalidation/reopening only. DOCS_READY may mean no further documentation expansion is required to satisfy the current milestone closure predicate, but it must not authorize, forbid, stop, resume, or otherwise govern design/execution workflow. Preserve DESIGN TO CLOSURE, NOT TO EXHAUSTION as a documentation-scope principle rather than a workflow command."
    - "Because the current V1 is explicitly unreleased and pending audit, this task is authorized as a pre-release candidate correction while retaining model_version 1 and existing V1 filenames. Do not create a parallel V2 model merely to repair these candidate defects. If fresh evidence establishes an external/released compatibility obligation, stop BLOCKED instead of silently breaking it."
    - "Run focused regressions, full repository unit tests, py_compile, and git diff --check on the exact final implementation. Produce TASK-0002 report evidence in a separate report-only commit and stop at Governing Architect review."
  allowed_existing_files_or_components:
    - DOCUMENT_MODEL.md
    - model/project.schema.v1.json
    - tools/validate.py
    - tests/test_validate.py
    - templates/docs/DECISIONS.md
    - .agent/tasks/TASK-0002/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Exactly eight authority domains, 45 concern keys, and twelve ID classes remain unchanged."
  - "model_version remains 1 and coverage.v1.json remains unchanged."
  - "F-04 audit concern remains intentionally unchanged: ordinary entity doc_ref/spec_ref references may legally share a broader section when current field semantics allow it; this task binds only the new unknown resolution_ref to its UNK identity."
  - "Depth remains declared documentation depth plus structural support evidence; validator does not judge factual/prose quality, maturity, security, reliability, performance, or design correctness."
  - "coverage.rationale normal-L1 shape, capability.status, dependencies[].critical, taxonomy/schema duplication, root-file structure, and naming are unchanged."
  - "Unknown kinds, blocking/open semantics, DECISION_REQUIRED->DEC semantics, capability build/buy/defer semantics, reachability/orphan semantics, sharding rules, and exit codes remain unchanged except where directly required by the three authorized fixes."
  - "Validator remains deterministic, read-only, network-free, and Python-standard-library-only."
  - "No workflow authority is imported from agent-skills into agent-documents; the fix is subtraction of workflow command, not replacement with another workflow rule."
  - "main remains read-only and branches remain exactly {dev, main}."

forbidden_changes:
  - "Do not merge/remove/rename authority domains, concern keys, ID classes, or root documents."
  - "Do not implement global ID-token binding for existing doc_ref/spec_ref fields."
  - "Do not add AI/NLP prose scoring, semantic-quality grading, maturity levels, evidence-strength scores, natural-language contradiction detection, or external dependencies."
  - "Do not remove rationale/status/critical fields, redesign capability/coverage/dependency shapes, shard the catalog, add a manifest/generator/database/registry, or solve predicted monorepo scale."
  - "Do not create V2 files, a migration framework, compatibility service, alternate validator, or new model subsystem."
  - "Do not modify README.md, model/coverage.v1.json, other templates, workflows, repository metadata, historical tasks/reports, other repositories, branch topology, main, tags, releases, or promotion state."
  - "Do not create branches, force-push, rebase, rewrite history, promote, tag, or release."

