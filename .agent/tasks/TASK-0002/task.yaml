      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest correction only in DOCUMENT_MODEL.md, project.schema.v1.json, validate.py, test_validate.py, and DECISIONS.md where materially required."
      required: true
    - id: CHECK-4
      command_or_check: "Run focused tests for resolution_ref path/domain/token/content semantics, DECISION_REQUIRED compatibility, empty role actors, feature-role actor intersection, and valid reusable-role controls."
      required: true
    - id: CHECK-5
      command_or_check: "python3 -m unittest discover -s tests"
      required: true
    - id: CHECK-6
      command_or_check: "python3 -m py_compile tools/validate.py tests/test_validate.py"
      required: true
    - id: CHECK-7
      command_or_check: "git diff --check plus exact base-to-final changed-file and semantic audit. Use the smallest sufficient trusted/native execution surface; Terminal/local shell is fallback only after native/connected/trusted alternatives are insufficient."
      required: true
    - id: CHECK-8
      command_or_check: "Commit/push implementation non-force to dev only. Then create/update .agent/tasks/TASK-0002/report.yaml in a separate report-only commit, verify its sole parent/diff, refresh dev/main/topology, and stop at Governing Architect review."
      required: true
  authoritative_verification:
