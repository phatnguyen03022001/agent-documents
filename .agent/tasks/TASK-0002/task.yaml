acceptance_criteria:
  - id: AC-1
    requirement: "Resolved unknown closure evidence is attributable without forcing every unknown into a DEC record."
    evidence_required: "Causal RED proves the old false-positive; final schema/model/validator/tests require RESOLVED UNK records to retain resolved_by_ref plus an exact-UNK-bound DECISIONS resolution_ref with structural content, while DECISION_REQUIRED still requires resolved_by_ref to DEC-* and QUESTION/ASSUMPTION remain semantically flexible."
  - id: AC-2
    requirement: "Role and feature actor semantics cannot be structurally disconnected."
    evidence_required: "Focused tests reject empty ROL.actor_refs and reject feature->ROL relations with zero actor intersection; valid reusable roles with at least one intersecting feature actor pass."
  - id: AC-3
    requirement: "DOCS_READY remains documentation closure rather than workflow authority."
    evidence_required: "DOCUMENT_MODEL.md §14 no longer commands design work to stop or requires governing workflow permission to continue; it defines only what closure means and how changed facts invalidate/reopen documentation closure."
  - id: AC-4
    requirement: "Core model decomposition and explicit audit no-change decisions remain intact."
    evidence_required: "Exact diff proves no changes to eight domains, 45 concerns, twelve identity classes, coverage taxonomy, global doc-ref token semantics, depth quality boundary, cleanup-candidate fields, catalog sharding, or unrelated model behavior."
  - id: AC-5
    requirement: "The pre-release V1 candidate remains internally consistent and deterministic."
    evidence_required: "DOCUMENT_MODEL.md, project.schema.v1.json, validator, DECISIONS template, and tests agree on the new bounded invariants; full unittest and py_compile pass."
  - id: AC-6
    requirement: "Publication lineage and topology remain exact."
    evidence_required: "Implementation is a non-force descendant of the TASK-0002 base; separate report-only commit changes only .agent/tasks/TASK-0002/report.yaml; main remains d95e56d098557bd2016041cfc995338c298a7d39 and branches remain exactly {dev, main}."

