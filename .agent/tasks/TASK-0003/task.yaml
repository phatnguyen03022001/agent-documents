  - "agent-skills remains owner of working method, handoff, authority, review, Git protocol, and generic execution governance."
  - "agent-standards remains owner of engineering quality/maturity meaning."
  - "Target repository remains owner of actual product truth and instantiated documentation."
  - "No new execution infrastructure owner or replacement subsystem is introduced."
  - "V1 model/schema/validator/template/test behavior remains unchanged."
  - "Historical .agent/tasks/** evidence remains unchanged."
  - "Branches remain exactly {dev, main}; main remains unchanged."

