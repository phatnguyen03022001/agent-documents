  status: RESOLVED
  source: "Current README.md and DOCUMENT_MODEL.md only."
  rationale: "This is a bounded subtractive documentation-boundary correction. No model/schema/validator/template/test or execution subsystem change is justified."

objective: "Remove or rewrite the two current operational agent-runtime references in agent-documents so the repository boundary accurately reflects the accepted four-repository ecosystem and generic execution governance, while preserving agent-documents ownership of describable project truth and documentation closure and preserving all historical task evidence."

scope:
  required_changes:
    - "In README.md, remove or rewrite the current sentence that describes agent-runtime as optional bounded execution infrastructure. Preserve the strict boundary that agent-documents does not own agent workflow authority/execution protocol and that actual product truth belongs in the target repository."
    - "In DOCUMENT_MODEL.md section 1, remove agent-runtime from the current repository-boundary list. Preserve the statement that agent-documents does not define execution infrastructure and preserve the remaining agent-documents/agent-standards/agent-skills/target-repository ownership boundaries."
    - "Do not replace agent-runtime with another named runtime, broker, shell wrapper, sandbox, daemon, registry, orchestrator, execution repository, or sixth system component. Generic execution remains governed by agent-skills/operator policy and is outside agent-documents ownership."
    - "Do not alter the V1 document model, eight authority domains, 45 concern taxonomy, schema, validator behavior, templates, tests, documentation-closure predicate, identity classes, reference semantics, build/buy semantics, or any TASK-0002 correction."
    - "Historical .agent/tasks/** references to agent-runtime or prior ecosystem state remain historical evidence and must not be rewritten merely because current operational references are being removed."
    - "Verify exact current README.md and DOCUMENT_MODEL.md contain no remaining live operational dependency/reference requiring agent-runtime after correction. Literal historical references outside these current semantic owners are not a failure."
    - "Commit/push the implementation non-force to dev, produce TASK-0003/report.yaml as a separate report-only commit, verify exact implementation/report lineage, unchanged main, exact {dev, main} topology, and stop at Governing Architect review."

  allowed_existing_files_or_components:
    - README.md
    - DOCUMENT_MODEL.md
    - .agent/tasks/TASK-0003/task.yaml
  expected_files_are_restrictive: true

invariants:
