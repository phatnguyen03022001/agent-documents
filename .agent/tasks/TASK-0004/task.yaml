acceptance_criteria:
  - id: AC-1
    requirement: "V1 can represent a truthful unresolved feature relation without false N/A or premature typed-domain identities."
    evidence_required: "Model/schema/validator accept exactly unresolved_ref -> existing OPEN DESIGN UNK as a third relation state while preserving refs and na semantics."
  - id: AC-2
    requirement: "Unresolved relation state is fail-closed for documentation closure."
    evidence_required: "Validator deterministically prevents DOCS_READY while any feature relation uses unresolved_ref; resolved/missing/non-DESIGN/wrong-class unknown targets are invalid."
  - id: AC-3
    requirement: "Typed graph and subset integrity are not weakened."
    evidence_required: "unresolved_ref creates no typed material-entity edge and cannot make a flow/entity typed reference to a missing DAT/IFC/EXT/CAP valid; existing graph/reachability/subset controls remain intact."
  - id: AC-4
    requirement: "Correction remains backward-compatible and minimal."
    evidence_required: "Existing refs and genuine na tests remain green; model_version=1, eight domains, 45 concerns and 12 identity classes remain exact; implementation diff is limited to DOCUMENT_MODEL.md, project schema, validator and tests unless a material contradiction proves one additional existing semantic owner must change under revised authority."
  - id: AC-5
    requirement: "The reproduced target blocker has a generic supported representation after correction."
    evidence_required: "A minimal anonymous regression fixture equivalent to the IELTS staged-migration condition validates structurally with unresolved relation(s) and reports closure blocked rather than schema/cross-reference failure."
  - id: AC-6
    requirement: "Verification and publication are exact and resilient to sandbox loss."
    evidence_required: "Focused regressions, full unittest suite, Python compile checks, and semantic/scope audit PASS against one exact immutable unreferenced candidate commit SHA; dev is then non-force advanced from the exact execution base to that same verified SHA without content reconstruction; successful report is a separate report-only child; main unchanged and topology exactly {dev, main}."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh GitHub truth; require dev equals exact handoff base, main equals d95e56d098557bd2016041cfc995338c298a7d39, topology exactly {dev, main}; resolve TASK-0004 revision 3 and pinned authorities; preflight repository read/write, isolated_test_execution, and concrete atomic Git-object operations create_blob/create_tree/create_commit/update_ref."
      required: true
    - id: CHECK-2
      command_or_check: "Reproduce the defect from the exact base with a minimal isolated target fixture and preserve causal RED evidence."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest mutually consistent DOCUMENT_MODEL/schema/validator/test correction. Prefer unresolved_ref -> UNK over nullable refs, empty arrays, false na, or premature domain identities."
      required: true
    - id: CHECK-4
      command_or_check: "Persist finalized changed-file bytes immediately as unreferenced Git blobs, then construct one unreferenced candidate tree/commit with sole parent equal to exact execution base. Verify the candidate commit diff contains only authorized implementation paths. Do not move dev."
      required: true
    - id: CHECK-5
      command_or_check: "From a fresh isolated surface, fetch/reconstruct the exact unreferenced candidate SHA and run focused tests covering valid unresolved relation, invalid target/status/phase, closure blocker, replacement with typed refs, controls for existing refs/na, and graph/subset behavior."
      required: true
    - id: CHECK-6
      command_or_check: "On that exact candidate SHA run python3 -m unittest discover -s tests and python3 -m py_compile tools/validate.py tests/test_validate.py."
      required: true
    - id: CHECK-7
      command_or_check: "Audit that exact candidate SHA: model_version=1, exactly 8 domains, 45 concern keys, 12 identity classes, unchanged coverage taxonomy, no target-specific semantics, no new framework/state machinery, exact authorized implementation paths only."
      required: true
    - id: CHECK-8
      command_or_check: "If CHECK-5..7 PASS, refresh refs and require dev still equals exact execution base; non-force update dev to the already verified candidate SHA. Create TASK-0004/report.yaml as a separate report-only child, verify parentage/diffs/final refs/topology, and stop at NEEDS_REVIEW. If verification does not PASS, do not move dev and fail closed."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

