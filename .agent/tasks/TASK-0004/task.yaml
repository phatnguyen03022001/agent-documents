structure_authority:
  status: RESOLVED
  source: "DOCUMENT_MODEL.md sections 7-9 and 13-18; model/project.schema.v1.json relationState; tools/validate.py relation/reference/closure validation; tests/test_validate.py."
  rationale: "The target pilot reproduced a missing state in the existing V1 candidate. The smallest correct repair is a backward-compatible unresolved relation state owned by the existing catalog plus deterministic validation/closure semantics. Revision 2 changes only execution/verification ordering so exact remote committed bytes, not a fragile transient sandbox snapshot, become the final verification subject."

objective: "Correct the unreleased V1 candidate so a feature relation can truthfully be represented as unresolved while its target typed identity is not yet materialized, without abusing N/A or inventing neighboring-domain records. Add one explicit catalog relation state bound to an existing open design-phase UNK-* record; keep it structurally valid but deterministically blocking for DOCS_READY until replaced by typed refs or genuine N/A. Preserve all existing valid V1 refs/na behavior and keep model_version 1."

scope:
  required_changes:
    - "Extend the existing applicability-aware feature relationState with exactly one third state: {\"unresolved_ref\": \"UNK-...\"}. The catalog remains owner of relation state; the referenced UNK record remains owner of the unresolved question/reason/context."
    - "Update DOCUMENT_MODEL.md so refs means a resolved applicable typed relationship, na means genuine demonstrated non-applicability, and unresolved_ref means the relation may/materially does apply but cannot yet be resolved to the required typed identity. Migration incompleteness or unresolved design must never be encoded as na."
    - "Require unresolved_ref to reference an existing UNK-* record that is OPEN and has resolution_phase DESIGN. A missing, RESOLVED, non-DESIGN, or wrong-class target is invalid. Once the unknown is resolved, the feature relation must be replaced with refs or genuine na rather than retaining unresolved_ref."
    - "Update model/project.schema.v1.json relationState to admit the exact unresolved_ref shape while preserving mutual exclusivity/additionalProperties=false and all existing refs/na shapes. Keep model_version 1 and all 45 concern keys, eight authority domains, and twelve identity classes unchanged."
    - "Update tools/validate.py cross-reference and closure logic so unresolved_ref is type-checked to UNK, does not create a material graph edge to a not-yet-existing target entity, and is a deterministic documentation-resolution blocker. A structurally valid OPEN milestone may contain unresolved_ref; DOCS_READY can never be TRUE while any feature relation retains unresolved_ref."
    - "Preserve flow-subset and typed-reference safety: unresolved_ref does not authorize a FLW/DAT/IFC/EXT/CAP record to reference a missing target, and it cannot satisfy another entity's typed reference requirement."
    - "Add focused regression/control tests proving: valid unresolved_ref to an OPEN DESIGN unknown is structurally accepted but closure-blocking; missing/wrong-class/resolved/non-DESIGN targets are rejected; false na is not introduced; existing refs and genuine na fixtures remain valid; replacing unresolved_ref with valid typed refs allows that relation blocker to disappear."
    - "Reproduce the exact-base defect in an isolated execution surface before mutation. Pre-publication tests may be used as construction evidence but are not the final exact-candidate proof."
    - "After the bounded implementation content is constructed and stale-state is refreshed, publish exactly one implementation commit non-force to dev. The implementation commit may be published before final full verification specifically so the immutable remote commit becomes the durable verification subject; this is not acceptance and does not authorize report success."
    - "Immediately re-fetch/reconstruct the exact published implementation SHA in a fresh isolated execution surface and run the focused regressions, full unittest suite, py_compile, and semantic/scope audit against that exact remote commit. Final verification evidence must name the exact implementation SHA."
    - "If exact-published-SHA verification passes, create .agent/tasks/TASK-0004/report.yaml as a separate report-only direct child and stop at NEEDS_REVIEW. If exact-published-SHA verification fails or cannot be completed, do not claim NEEDS_REVIEW; produce a truthful terminal report when capability permits, with BLOCKED or REVERIFY_REQUIRED evidence bound to the exact published implementation SHA, and stop for Architect action."
    - "Do not modify templates unless an existing template contains relationState semantics that would become materially false after this correction. The empty project template does not need ceremonial churn."
    - "Do not modify README.md unless exact current text becomes materially false; prefer no README change."

  allowed_existing_files_or_components:
    - DOCUMENT_MODEL.md
    - model/project.schema.v1.json
    - tools/validate.py
    - tests/test_validate.py
    - .agent/tasks/TASK-0004/task.yaml
  expected_files_are_restrictive: true

