structure_authority:
  status: RESOLVED
  source: "DOCUMENT_MODEL.md sections 7-9 and 13-18; model/project.schema.v1.json relationState; tools/validate.py relation/reference/closure validation; tests/test_validate.py."
  rationale: "The target pilot reproduced a missing state in the existing V1 candidate. The semantic correction remains unchanged. Revision 3 changes only execution persistence: exact candidate bytes are first stored as unreferenced Git objects and assembled into an immutable unreferenced candidate commit, which is then verified from a fresh isolated surface before dev is fast-forwarded to that exact verified commit."

objective: "Correct the unreleased V1 candidate so a feature relation can truthfully be represented as unresolved while its target typed identity is not yet materialized, without abusing N/A or inventing neighboring-domain records. Add one explicit catalog relation state bound to an existing open design-phase UNK-* record; keep it structurally valid but deterministically blocking for DOCS_READY until replaced by typed refs or genuine N/A. Preserve all existing valid V1 refs/na behavior and keep model_version 1."

scope:
  required_changes:
    - "Extend the existing applicability-aware feature relationState with exactly one third state: {\"unresolved_ref\": \"UNK-...\"}. The catalog remains owner of relation state; the referenced UNK record remains owner of the unresolved question/reason/context."
    - "Update DOCUMENT_MODEL.md so refs means a resolved applicable typed relationship, na means genuine demonstrated non-applicability, and unresolved_ref means the relation may/materially does apply but cannot yet be resolved to the required typed identity. Migration incompleteness or unresolved design must never be encoded as na."
    - "Require unresolved_ref to reference an existing UNK-* record that is OPEN and has resolution_phase DESIGN. A missing, RESOLVED, non-DESIGN, or wrong-class target is invalid. Once the unknown is resolved, the feature relation must be replaced with refs or genuine na rather than retaining unresolved_ref."
    - "Update model/project.schema.v1.json relationState to admit the exact unresolved_ref shape while preserving mutual exclusivity/additionalProperties=false and all existing refs/na shapes. Keep model_version 1 and all 45 concern keys, eight authority domains, and twelve identity classes unchanged."
    - "Update tools/validate.py cross-reference and closure logic so unresolved_ref is type-checked to UNK, does not create a material graph edge to a not-yet-existing target entity, and is a deterministic documentation-resolution blocker. A structurally valid OPEN milestone may contain unresolved_ref; DOCS_READY can never be TRUE while any feature relation retains unresolved_ref."
    - "Preserve flow-subset and typed-reference safety: unresolved_ref does not authorize a FLW/DAT/IFC/EXT/CAP record to reference a missing target, and it cannot satisfy another entity's typed reference requirement."
    - "Add focused regression/control tests proving: valid unresolved_ref to an OPEN DESIGN unknown is structurally accepted but closure-blocking; missing/wrong-class/resolved/non-DESIGN targets are rejected; false na is not introduced; existing refs and genuine na fixtures remain valid; replacing unresolved_ref with valid typed refs allows that relation blocker to disappear."
    - "Before expensive reconstruction, preflight an atomic Git-object publication path capable of create_blob, create_tree, create_commit, and non-force update_ref semantics. If that path is not currently available, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE before rebuilding the candidate."
    - "Reproduce the exact-base defect in an isolated execution surface and construct only the authorized bounded correction. Construction-time tests may be used as evidence but are not the final exact-candidate proof."
    - "As soon as each changed candidate file is finalized, persist its exact bytes as an unreferenced Git blob. Assemble those blobs with the unchanged exact-base tree into one unreferenced candidate tree and one unreferenced candidate commit whose sole parent is the exact execution base. Do not move dev yet. Unreferenced Git objects are durable staging/evidence only and create no branch authority or accepted repository state."
    - "From a fresh isolated execution surface, fetch/reconstruct the exact unreferenced candidate commit and run focused regressions, the full unittest suite, py_compile, and semantic/scope audit against that exact immutable candidate SHA. Final verification evidence must name that SHA."
    - "Only if exact-candidate-SHA verification passes, refresh dev/main/topology and require dev still equals the exact execution base, then fast-forward dev non-force to the already verified candidate commit. Do not rebuild or substitute candidate bytes between verification and ref advancement."
    - "After successful dev advancement, create .agent/tasks/TASK-0004/report.yaml as a separate report-only direct child and stop at NEEDS_REVIEW. If candidate verification fails, leave dev at the execution base and publish a truthful BLOCKED report-only child when capability permits. If verification cannot be completed, fail closed without moving dev."
    - "Do not modify templates unless an existing template contains relationState semantics that would become materially false after this correction. The empty project template does not need ceremonial churn."
    - "Do not modify README.md unless exact current text becomes materially false; prefer no README change."

  allowed_existing_files_or_components:
    - DOCUMENT_MODEL.md
    - model/project.schema.v1.json
    - tools/validate.py
    - tests/test_validate.py
    - .agent/tasks/TASK-0004/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "The eight authority domains remain unchanged."
  - "The 45 coverage concern keys remain unchanged."
  - "The twelve identity classes remain unchanged."
  - "model_version remains 1; this is a backward-compatible correction to an unreleased candidate, not a V2 redesign."
  - "Catalog remains authoritative for feature relation state; Markdown remains authoritative for project explanation/specification."
  - "refs remains non-empty and typed; na remains genuine non-applicability with rationale; unresolved_ref is distinct from both."
  - "An unresolved relation always prevents DOCS_READY and cannot survive as a resolved relation representation."
  - "No target-specific IELTS semantics are copied into the generic model or tests beyond minimal anonymous fixtures reproducing the defect class."
  - "No new orchestration, migration registry, lifecycle engine, database, queue, ninth authority domain, or identity class is introduced."
  - "Unreferenced Git blobs/trees/commits are immutable staging/evidence only; they do not alter branch history, create target authority, or constitute publication."
  - "Only a candidate commit verified by exact immutable SHA may become dev for a successful execution."
  - "Branches remain exactly {dev, main}; main remains d95e56d098557bd2016041cfc995338c298a7d39."

forbidden_changes:
  - "Do not modify model/coverage.v1.json, root templates without material need, README without material need, requirements, workflows, prior task/report/review history, or any external repository."
  - "Do not add a generic PENDING status to all entities, nullable typed references, empty refs arrays, wildcard IDs, or another relation registry."
  - "Do not reinterpret na as migration-incomplete/unknown."
  - "Do not permit unresolved_ref to target arbitrary strings, non-UNK identities, RESOLVED unknowns, or POST_MILESTONE/IMPLEMENTATION/VERIFICATION unknowns."
  - "Do not let unresolved_ref satisfy DOCS_READY, graph reachability to an absent entity, flow-subset requirements, or assurance/maturity claims."
  - "Do not move dev to an unverified candidate SHA."
  - "Do not treat unreferenced Git staging objects as repository authority or evidence of successful execution."
  - "Do not change agent-standards or agent-skills semantics."
  - "Do not create branch, PR, tag, release, repository metadata mutation, or main mutation."

