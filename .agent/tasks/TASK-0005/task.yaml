structure_authority:
  status: RESOLVED
  source: "tools/validate.py recs() feature-relation validation and tests/test_validate.py"
  rationale: "The reproduced defect concerns only deterministic ordering of diagnostics for the same malformed input. The smallest correction is to make relation-key iteration explicitly ordered and lock that behavior with a regression. No model, schema, documentation, closure, identity, coverage, sharding, or release semantic changes are required."

objective: "Make V1 validator diagnostics deterministic for identical malformed catalogs across Python hash seeds while preserving the exact set/classification of errors, exit behavior, relation semantics, graph behavior, and DOCS_READY semantics. Add the smallest regression proving byte-stable diagnostic ordering. Do not perform unrelated validator optimization or model change."

scope:
  required_changes:
    - "In tools/validate.py, replace the unordered iteration used for feature relation keys with one explicit stable ordered sequence containing exactly roles, flows, data, interfaces, dependencies, capabilities. Preserve exact field validation and relation semantics."
    - "In tests/test_validate.py, add a focused regression using one malformed catalog with multiple feature-relation diagnostics and multiple PYTHONHASHSEED values to prove identical ordered diagnostic output and identical exit behavior for the same input. The regression must fail against the exact execution base before the correction and pass against the candidate."
    - "Preserve the exact diagnostic set and classification for existing inputs. This task may stabilize order only; it must not suppress, add, reclassify, merge, or reinterpret existing validator errors except for the new regression fixture's test harness assertions."
    - "Run focused regression/control tests, the complete unittest suite, and py_compile against one exact immutable candidate SHA."
    - "Before implementation, preflight an atomic Git-object publication path capable of create_blob, create_tree, create_commit, and non-force update_ref semantics. If unavailable, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE before constructing a candidate."
    - "Persist finalized changed-file bytes as unreferenced Git blobs, assemble one unreferenced candidate tree/commit whose sole parent is the exact execution base, and verify that exact immutable candidate from a fresh isolated execution surface before moving dev."
    - "Only after exact-candidate verification passes, refresh refs and require dev still equals the exact execution base; then fast-forward dev non-force to that exact verified candidate commit."
    - "After successful dev advancement, publish .agent/tasks/TASK-0005/report.yaml as a separate report-only direct child and stop at NEEDS_REVIEW. If candidate verification fails, do not move dev; publish only a truthful blocking report when authorized capability permits."

  allowed_existing_files_or_components:
    - tools/validate.py
    - tests/test_validate.py
    - .agent/tasks/TASK-0005/task.yaml
  expected_files_are_restrictive: true

