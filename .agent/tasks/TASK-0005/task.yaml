acceptance_criteria:
  - id: AC-1
    requirement: "Diagnostic ordering is deterministic for identical malformed feature-relation input across Python hash seeds."
    evidence_required: "A focused regression reproduces differing order on the exact base and proves identical ordered output on the candidate across multiple explicit PYTHONHASHSEED values."
  - id: AC-2
    requirement: "The correction changes ordering only, not validator meaning."
    evidence_required: "For the regression fixture and existing controls, diagnostic classes/set, blocker behavior, and exit result remain unchanged while order becomes stable."
  - id: AC-3
    requirement: "Existing V1 relation and closure semantics remain exact."
    evidence_required: "The complete existing unittest suite plus focused refs/na/unresolved_ref/closure controls pass without model/schema/documentation changes."
  - id: AC-4
    requirement: "The implementation is minimal and contains no deferred optimization disguised as release hardening."
    evidence_required: "Base-to-candidate diff changes exactly tools/validate.py and tests/test_validate.py and contains only stable relation-key iteration plus the deterministic-order regression."
  - id: AC-5
    requirement: "Verification and publication bind the exact candidate."
    evidence_required: "Focused multi-seed regression, full unittest suite, py_compile, and semantic/scope audit PASS against one immutable candidate SHA; dev is then non-force advanced from the exact execution base to that same SHA; report is a separate report-only child; main and topology remain unchanged."

