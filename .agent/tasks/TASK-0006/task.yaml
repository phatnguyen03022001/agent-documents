structure_authority:
  status: RESOLVED
  source: "README.md release-identity paragraph plus protocol-v3 review/promotion/release separation"
  rationale: "The V1 model is already accepted for release preparation. The only semantic repository change required before release is replacing stale unreleased-candidate wording with durable versioned-release guidance. Promotion, version tagging, and release publication must occur only after this exact preparation candidate is reviewed and accepted through exact continuation authority."

objective: "Prepare the exact V1.0.0 release candidate without changing V1 model semantics: update only README release identity, verify the exact immutable candidate, publish the canonical report, and stop at NEEDS_REVIEW. After an ACCEPTED Architect review, later exact continuation authority may promote the accepted lineage to main and then create/publish V1.0.0."

scope:
  required_changes:
    - "Update only the README.md paragraph that currently states V1 is an unreleased candidate pending independent audit. Replace it with concise durable release-version guidance establishing v1.0.0 as the first stable V1 release and instructing stable consumers to pin released tags rather than mutable branch tips. Do not rewrite unrelated README content."
    - "Do not change DOCUMENT_MODEL.md, model files, validator behavior, tests, templates, workflow files, dependencies, or task history except for TASK-0006 report/review lifecycle artifacts."
    - "Verify that the release-preparation candidate preserves model_version=1, exactly eight authority domains, exactly 45 coverage concerns, exactly twelve identity classes, refs/na/unresolved_ref semantics, closure semantics, and one-level sharding semantics."
    - "Run the complete unittest suite and py_compile against one exact immutable release-preparation candidate SHA. README-only semantic preparation must not weaken existing 94-test evidence."
    - "Use immutable Git-object candidate construction and exact-SHA verification before moving dev. The implementation candidate must have the exact execution base as sole parent and change README.md only."
    - "Only after exact-candidate verification passes, refresh refs and require dev still equals the exact execution base and main still equals d95e56d098557bd2016041cfc995338c298a7d39; then fast-forward dev non-force to the verified README-only candidate."
    - "Publish .agent/tasks/TASK-0006/report.yaml as a separate report-only direct child and stop at NEEDS_REVIEW. Do not promote main, create a version tag, or publish a release during EXECUTION."
    - "Post-review release path is deliberately continuation-gated: an ACCEPTED review must be persisted first. A later exact PROMOTION continuation may fast-forward main to the exact accepted TASK-0006 lineage. Only after promotion is independently confirmed may a later exact RELEASE continuation create v1.0.0 at that promoted main commit and publish the GitHub release."
    - "At each post-review continuation, fail closed if expected refs drift, v1.0.0 already exists unexpectedly, a release already exists unexpectedly, or required write capability is unavailable."
    - "Current operator environment is phone-only ChatGPT + GitHub. Agent Runtime is unavailable and must not be probed, invoked, routed to, or relied upon unless the operator later explicitly states it is available. Codex must be minimized; it is not required for EXECUTION. In a later continuation, Codex may be used only if a task-required promotion/tag/release predicate cannot be satisfied with ChatGPT + GitHub, and then only with Luna at high effort for the narrow required operation."

  allowed_existing_files_or_components:
    - README.md
    - .agent/tasks/TASK-0006/task.yaml
  expected_files_are_restrictive: true

