      required: true
    - id: CHECK-3
      command_or_check: "Persist the finalized README bytes as an unreferenced Git blob and construct one immutable unreferenced candidate tree/commit whose sole parent is the exact execution base. Confirm base-to-candidate diff is README.md only."
      required: true
    - id: CHECK-4
      command_or_check: "From a fresh isolated surface reconstruct/fetch the exact candidate SHA and run python3 -m unittest discover -s tests plus python3 -m py_compile tools/validate.py tests/test_validate.py."
      required: true
    - id: CHECK-5
      command_or_check: "Audit exact candidate invariants: model_version=1; exactly 8 authority domains, 45 concern keys, 12 identity classes; relation/closure/sharding semantics unchanged; no performance/catalog/framework work; README release wording is concise and durable."
      required: true
    - id: CHECK-6
      command_or_check: "If CHECK-4..5 PASS, refresh refs and require dev still equals exact execution base and main unchanged; non-force advance dev to the exact verified candidate. Publish TASK-0006/report.yaml as separate report-only child, verify final refs/topology/release absence, and stop at NEEDS_REVIEW."
      required: true
  authoritative_verification:
