  - id: AC-1
    requirement: "README no longer makes the stale unreleased/pending-audit claim and instead gives durable V1.0.0 release identity guidance."
    evidence_required: "Exact candidate diff changes only the release-identity paragraph in README.md and states v1.0.0 as the first stable V1 release while directing stable consumers to released tags rather than mutable branch tips."
  - id: AC-2
    requirement: "Release preparation changes no V1 semantics."
    evidence_required: "Model/version/domain/taxonomy/identity/relation/closure/sharding invariants remain exact and no model/schema/validator/test/template semantic file changes."
  - id: AC-3
    requirement: "The exact release-preparation candidate is verified."
    evidence_required: "Full unittest suite and py_compile PASS against one immutable candidate SHA whose sole parent is the exact execution base and whose implementation diff is README.md only."
  - id: AC-4
    requirement: "Preparation preserves release separation."
    evidence_required: "During EXECUTION main remains d95e56d098557bd2016041cfc995338c298a7d39, no v1.0.0 tag or GitHub release is created, report is a separate report-only child, and result stops at NEEDS_REVIEW."
  - id: AC-5
    requirement: "Post-review release actions remain fail-closed and exact-lineage bound."
    evidence_required: "Task authority explicitly requires persisted ACCEPTED review plus exact continuation before promotion, and independently confirmed promotion before v1.0.0 tag/release publication."

