  - "No heading-index optimization, catalog ergonomics, ID allocation tooling, lite/large profiles, nested authority hierarchy, ninth domain, multiple catalog, database, registry, orchestration, or framework expansion is introduced."
  - "Branches remain exactly {dev, main} throughout preparation. main remains d95e56d098557bd2016041cfc995338c298a7d39 until an exact post-review PROMOTION continuation."
  - "No tag or GitHub release is created before an ACCEPTED TASK-0006 review and exact release continuation."
  - "Stable release identity is v1.0.0."

forbidden_changes:
