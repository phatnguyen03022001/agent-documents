    - >-
      Add repository-root .gitignore with exactly these 14 lines: .DS_Store; __pycache__/; *.py[cod]; .venv/; venv/;
      .pytest_cache/; .mypy_cache/; .ruff_cache/; .coverage; coverage/; .env; .env.*; !.env.example; !.env.*.example.
    - >-
      Prove no tracked path becomes ignored; prove required positive ignore cases and negative example-file/canonical-path cases.
    - >-
      Run repository-native self-verification against the same exact candidate: python3 -B -m unittest discover -s tests
      -p 'test_*.py'; python3 -B -m py_compile tools/validate.py tests/test_validate.py; git diff --check; exact scope/diff
      checks; and final repository hygiene. Do not invoke tools/validate.py against agent-documents itself: it is a consumer
      validator whose argument is a target repository containing docs/catalog/project.json, not a self-validator for this repo.
    - >-
      Once semantic choices, exact binding, and capabilities are resolved, execute each maximal contiguous mechanically
      derivable suffix as one logical EXECUTION BUNDLE and realize that bundle with exactly one terminal_exec.
    - >-
      Record post-binding Agent Runtime invocation count, logical-bundle-to-terminal_exec mapping, genuine controller-return
      reasons, and trustworthy timing boundaries when directly observed. Hostname/computer name is diagnostic only and must
      never select authority, execution eligibility, repository identity, or evidence validity.
    - >-
      Preserve comparison baselines as observations only: TASK-0036 operator E2E 592s / 62 terminal_exec / about 37.6s Mac
      child-process sum / about 0.64s Agent Runtime overhead / about 21s runtime-to-tunnel observation; TASK-0013 operator
      E2E 581s / 22 terminal_exec / canonical post-binding-to-decision 194s. Do not infer model/controller/transport causality
      from this pilot alone.
    - >-
      Publish the exact .gitignore candidate on dev, then publish one report-only child. Main remains unchanged.
  allowed_existing_files_or_components:
    - ".gitignore"
    - ".agent/tasks/TASK-0007/report.yaml"

