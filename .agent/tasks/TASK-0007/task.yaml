objective: >-
  Add the smallest stack-appropriate repository-root .gitignore for agent-documents and use this real hygiene task as
  the first natural CHATGPT_LOCAL latency pilot after ecosystem activation of the rule that one logical deterministic
  EXECUTION BUNDLE is realized by exactly one Agent Runtime terminal_exec. Preserve all correctness and publication
  predicates; measure execution shape without turning latency into a correctness shortcut or causal overclaim.

