structure_authority:
  status: RESOLVED
  source: "Existing DOCUMENT_MODEL.md release-status introduction."
  rationale: "This is a stale release-state sentence only. No schema, taxonomy, validator, template, authority domain, documentation layout or release machinery change is justified."

objective: "Align the normative DOCUMENT_MODEL.md release-state introduction with the already-published stable v1.0.0 release while preserving every V1 documentation-governance semantic and repository boundary."

scope:
  required_changes:
    - "Modify only the opening release-state paragraph of DOCUMENT_MODEL.md so it no longer describes V1 as an unreleased candidate pending independent audit and instead truthfully states that this is the normative Agent Documents V1 specification and that the first stable V1 release is v1.0.0."
    - "Preserve the rest of DOCUMENT_MODEL.md semantically and structurally unchanged, including the eight authority domains, 45 coverage concerns, depth semantics, identity classes, catalog rules, DOCS_READY closure model and consumer-validator boundary."
    - "Prove the corrected normative wording is consistent with README.md and the immutable public v1.0.0 tag/release identity without rewriting the historical v1.0.0 tag."
    - "Run the repository-native unittest suite, py_compile checks, exact diff/scope proof and git diff --check on the exact candidate; publish candidate and truthful report non-force to dev, then stop for Governing Architect review."
  allowed_existing_files_or_components:
    - DOCUMENT_MODEL.md
  expected_files_are_restrictive: true

invariants:
  - "The eight canonical authority domains remain exactly PRODUCT, BEHAVIOR, ARCHITECTURE, DATA, INTERFACES, QUALITY, DELIVERY and DECISIONS."
  - "The finite V1 coverage taxonomy remains exactly 45 concerns and no ninth authority domain is introduced."
  - "Identity classes, catalog semantics, DOCS_READY closure semantics, validator behavior and target-repository truth ownership remain unchanged."
  - "agent-documents continues to define documentation describability/closure only; it does not claim documentation structure proves engineering quality, maturity, factual correctness, security quality or implementation correctness."
  - "HTTP/API contract content remains target-owned under INTERFACES when applicable; this task introduces no HTTP-specific machinery."
  - "Historical tag v1.0.0 and main remain unchanged; topology remains exactly dev/main."

forbidden_changes:
  - "Do not modify README.md, model/, templates/, tools/, tests/, .gitignore, prior task evidence, dependencies, workflows, repository settings, tags, releases or main."
  - "Do not change the 8-domain model, 45-concern taxonomy, depth levels, identity classes, catalog schema, graph/closure rules, DOCS_READY semantics or validator behavior."
  - "Do not add an AI prose grader, ninth domain, maturity/quality scoring, HTTP framework, release automation, migration framework, registry, scheduler, queue, daemon, planner service or documentation platform."
  - "Do not claim the documentation model guarantees product engineering quality, security correctness, factual correctness or absolute completeness."
  - "Do not create/delete/rename branches, force-push, promote, tag, release or mutate main."
  - "Do not author review.yaml."

